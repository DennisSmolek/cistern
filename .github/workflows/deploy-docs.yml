name: Deploy Docs (Cloudflare Workers)

on:
    push:
        branches: [main]
        paths:
            - "apps/docs-astro/**"
            - ".github/workflows/deploy-docs.yml"
    workflow_dispatch: {}

permissions:
    contents: read

concurrency:
    group: deploy-docs-${{ github.ref }}
    cancel-in-progress: true

env:
    NODE_VERSION: "22"
    WORKING_DIRECTORY: apps/docs-astro

jobs:
    build-and-deploy:
        name: Build and Deploy
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ env.NODE_VERSION }}
                  cache: "pnpm"

            - name: Install dependencies (monorepo)
              run: pnpm install --no-frozen-lockfile

            - name: Build workspace packages
              run: pnpm -w -r run build

            - name: Build Astro docs
              working-directory: ${{ env.WORKING_DIRECTORY }}
              run: pnpm run build

            - name: Deploy to Cloudflare Workers
              working-directory: ${{ env.WORKING_DIRECTORY }}
              env:
                  CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
                  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
              run: pnpm dlx wrangler@latest deploy --config wrangler.toml
